<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concierge</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Saira SemiCondensed', monospace;
            background: linear-gradient(135deg, #000000 0%, #101010 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: rgba(54, 53, 53, 0.484);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 3em;
            margin-bottom: 0.5em;
        }

        p {
            color: #ccc;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .botao-explorar {
            display: inline-block;
            padding: 15px 30px;
            font-size: 1.2em;
            color: #fff;
            background-color: #4975a4;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .botao-explorar:hover {
            background-color: #3b5c7a;
            box-shadow: 0 6px 20px rgba(49, 95, 122, 0.5);
        }
    </style>

</head>

<body>

    <div class="container">
        <h1>CONCIERGE AR</h1>
        <p> Conheça os melhores restaurantes através de uma experiência imersiva em Realidade Aumentada!</p>

        <p><a href="cardapio.html" class="botao-explorar">Explorar Restaurantes</a></p>

    </div>
</body>

</html>
